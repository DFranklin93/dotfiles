# ── VirtualBox / Rendering ─────────────────────────────────────
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = LIBGL_ALWAYS_SOFTWARE,1
env = WLR_BACKENDS,x11

# ── Startup ────────────────────────────────────────────────────
exec-once = sleep 2 && pkill VBoxClient; true
exec-once = sleep 3 && VBoxClient --clipboard
# exec = bash -c 'pkill -f wayland-to-x11-clip.sh; sleep 5 && /home/solodominus/wayland-to-x11-clip.sh > /tmp/clipboard-sync.log 2>&1 &'
exec = bash -c 'sleep 5 && /home/solodominus/wayland-to-x11-clip.sh > /dev/null 2>&1 &'
exec = bash -c 'echo "hyprland exec test" > /tmp/hypr-test.log'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec = pkill waybar; sleep 1 && waybar
exec = pkill mako; sleep 1 && mako
exec = /home/solodominus/start-wallpaper.sh

# ── Monitor ────────────────────────────────────────────────────
monitor=Virtual-1,preferred,auto,1

# ── Xwayland ───────────────────────────────────────────────────
xwayland {
  force_zero_scaling = true
}

# ── Input ──────────────────────────────────────────────────────
input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = false
  }
}

# ── General ────────────────────────────────────────────────────
general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(cdd6f4ff)
  col.inactive_border = rgba(595959ff)
  layout = dwindle
}

# ── Misc ───────────────────────────────────────────────────────
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

# ── Keybinds ───────────────────────────────────────────────────
$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, SPACE, exec, wofi --show drun
bind = $mainMod SHIFT, L, exec, bash /home/solodominus/lock.sh
bind = $mainMod, E, exec, thunar
bind = $mainMod, N, exec, makoctl dismiss --all
bind = $mainMod, W, killactive
bind = $mainMod, M, exit

# Window focus (vim-style)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Float / fullscreen
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, togglefloating

# Mouse window controls
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, bash /home/solodominus/screenshot.sh full
bind = SHIFT, Print, exec, bash /home/solodominus/screenshot.sh region
bind = $mainMod, Print, exec, bash /home/solodominus/screenshot.sh window
bind = $mainMod SHIFT, Print, exec, bash /home/solodominus/screenshot.sh clipboard
